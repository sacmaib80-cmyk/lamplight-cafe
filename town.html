<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wrenfield — โครงแมพวันแรก</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Nunito:wght@700;800&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #0b1016; overflow: hidden; touch-action: none; }
#stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#townhud { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); width: min(560px, 92vw); padding: 9px 14px; background: #fbf5ea; color: #2b2119; border-radius: 4px; font: 500 15px/1.45 Mali, sans-serif; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
#townhud b { display: block; font-weight: 600; }
#townhud .go { display: inline-block; margin-top: 6px; padding: 6px 16px; background: #2b2119; color: #fbf5ea; border-radius: 4px; text-decoration: none; font-weight: 600; }
#townhud small { display: block; margin-top: 3px; font-size: 12.5px; color: #6b5f55; }

/* ฉากคุยกับ Mrs Hart: ภาพตัวละคร + กระดาษครีมแบบหน้าคุยรอบ 2 */
#scene { position: fixed; inset: 0; z-index: 10; background: radial-gradient(120% 80% at 50% 30%, #5a4232, #2a1d16 70%); font-family: Mali, sans-serif; }
#scene .portrait { position: absolute; left: 50%; bottom: 210px; transform: translateX(-50%); height: min(62vh, 560px); max-width: 96vw; object-fit: contain; }
#scene .talk { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(640px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 7px; }
#scene .card { background: #fbf5ea; color: #2b2119; border-radius: 3px 14px 14px 14px; padding: 9px 14px 10px; box-shadow: 0 2px 0 rgba(0,0,0,.28); }
#scene .who { margin: 0; font: 700 15px Nunito, sans-serif; color: #9a6a2c; }
#scene .replay, #scene .tr { border: 0; background: none; color: #8a7d6d; font: 500 12.5px Mali, sans-serif; text-decoration: underline; padding: 0 0 0 6px; }
#scene .tr { padding: 4px 0 0; }
#scene .en { margin: 2px 0 0; font: 800 18px/1.32 Nunito, sans-serif; }
#scene .th { margin: 4px 0 0; font: 400 14.5px Mali, sans-serif; color: #5d5148; }
#scene .gl { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 7px 0 0; padding-top: 7px; border-top: 1px solid #e6dccb; }
#scene .gl span { display: inline-flex; flex-direction: column; line-height: 1.2; cursor: pointer; }
#scene .gl b { font: 800 14px Nunito, sans-serif; color: #8a5a1e; } #scene .gl small { font: 400 13px Mali, sans-serif; color: #5d5148; }
#scene .you { margin: 0; align-self: flex-end; color: #f0e4d0; font: 600 14px Nunito, Mali, sans-serif; }
#scene .tip { margin: 0; color: #f0e2c6; font: 400 13.5px/1.45 Mali, sans-serif; }
#scene .chips { display: flex; gap: 8px; }
#scene .chip { flex: 1; text-align: left; border: 1.5px solid #2b2119; background: #f3e9d8; border-radius: 5px; padding: 7px 10px; display: flex; flex-direction: column; }
#scene .chip b { font: 800 14.5px Nunito, sans-serif; color: #2b2119; } #scene .chip i { font: 400 12.5px Mali, sans-serif; font-style: normal; color: #6b5f55; }
#scene .say { display: flex; gap: 6px; background: #fffdf8; border-radius: 6px; padding: 5px; }
#scene .say input { flex: 1; min-width: 0; border: 0; background: none; font: 600 16px Nunito, sans-serif; padding: 0 8px; outline: none; }
#scene .say button { border: 1.5px solid #2b2119; background: #fffdf8; border-radius: 5px; padding: 8px 12px; font: 600 14px Mali, sans-serif; }
#scene .say .send { background: #2b2119; color: #fbf5ea; } #scene .say .mic.on { background: #b8402c; color: #fff; border-color: #b8402c; }
#scene { transition: opacity .5s; } #scene.out { opacity: 0; }
#scene .endcard { position: absolute; inset: 0; background: rgba(250, 238, 214, .97); color: #2b2119; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; font-family: Mali, sans-serif; }
#scene .endcard h2 { margin: 4px 0 10px; font: 700 30px Mali, sans-serif; } #scene .endcard .kicker { margin: 0; color: #9a6a2c; }
#scene .endcard .call { font-weight: 600; color: #b8402c; } #scene .endcard .next { color: #6b5f55; }
#scene .endcard .again { margin-top: 10px; padding: 9px 20px; border-radius: 4px; border: 0; background: #2b2119; color: #fbf5ea; font: 600 15px Mali, sans-serif; }
@media (max-width: 520px) { #scene .portrait { bottom: 250px; height: 46vh; } }

/* หน้าคุยรอบ 3 (เหมือนร้าน): กระดาษครีม = คนที่คุยด้วย · การ์ดฝั่งเรา = กรอบเข้มบรรทัดเดียว ไทยขึ้นเฉพาะใบที่แตะ · แตะคำสีอำพันดูคำแปล · คอมอยู่กลาง */
#scene .talk { width: min(760px, calc(100vw - 24px)); gap: 8px; }
#scene .card { align-self: flex-start; max-width: 100%; padding: 8px 13px 10px; }
#scene .who { display: flex; align-items: center; gap: 6px; font-size: 14px; }
#scene .replay { display: inline-grid; place-items: center; width: 26px; height: 26px; padding: 0; color: #9a6a2c; text-decoration: none; }
#scene svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#scene .tr { margin-left: auto; padding: 0 9px; border: 1px solid #d9ccb6; border-radius: 10px; font: 500 13px Mali, sans-serif; color: #8a7a68; text-decoration: none; }
#scene .en { font-size: 19px; line-height: 1.34; cursor: pointer; }
#scene .en .ck { color: #9a5a12; cursor: pointer; }
#scene .en .tut { position: relative; }
#scene .en .ring { position: absolute; left: 50%; top: 55%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2.5px solid #ffc979; background: rgba(255, 201, 121, .18); pointer-events: none; animation: tutring 1.6s ease-out infinite; }
#scene .en .hand { position: absolute; left: 58%; top: 62%; width: 34px; height: 42px; pointer-events: none; fill: #fff8ec; stroke: #2a1d16; stroke-width: 2.2; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); animation: tuttap 1.6s ease-in-out infinite; }
@keyframes tutring { 0%, 30% { transform: scale(.6); opacity: 0; } 45% { opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes tuttap { 0%, 100% { transform: translate(6px, 8px); } 35% { transform: translate(0, 0); } 45% { transform: translate(0, 2px) scale(.94); } }
#scene .wordpop { position: fixed; z-index: 12; display: flex; gap: 6px; align-items: baseline; padding: 5px 11px 6px; background: #2a1d16; color: #fbf5ea; border-radius: 7px; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); font: 400 15px Mali, sans-serif; }
#scene .wordpop b { font: 800 15.5px Nunito, sans-serif; color: #ffc979; }
#scene .chips { flex-direction: column; align-items: flex-end; gap: 6px; transition: opacity .35s ease, transform .35s ease; }
#scene .talk.speaking .chips { opacity: 0; transform: translateY(6px); pointer-events: none; }
#scene .chip { flex: none; max-width: 100%; align-items: flex-end; text-align: right; border: 0; border-radius: 14px 3px 14px 14px; padding: 6px 12px 7px; background: rgba(24, 16, 12, .74); box-shadow: inset 0 0 0 1.5px rgba(251, 245, 234, .5); cursor: pointer; }
#scene .chip b { font: 700 15.5px Nunito, sans-serif; color: #fbf5ea; }
#scene .chip i { display: none; font-size: 14px; color: #e3cfae; }
#scene .chip.on { background: rgba(24, 16, 12, .88); box-shadow: inset 0 0 0 2px #ffc979; }
#scene .chip.on i { display: block; }
#scene .you { font-size: 14.5px; }
#scene .say { align-items: center; gap: 7px; padding: 4px 4px 4px 13px; border-radius: 5px; }
#scene .say input { font: 700 17px Nunito, sans-serif; padding: 0; }
#scene .say input::placeholder { font: 400 14.5px Mali, sans-serif; color: #9b8b7a; }
#scene .say button { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; }
#scene .say svg { width: 21px; height: 21px; }
@media (min-width: 521px) {
  #scene .card { align-self: center; text-align: center; border-radius: 12px; min-width: min(520px, 100%); padding: 10px 17px 12px; }
  #scene .who { justify-content: center; position: relative; font-size: 16px; }
  #scene .tr { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 15px; }
  #scene .en { font-size: clamp(19px, 1.9vw, 26px); }
  #scene .chips { flex-direction: row; justify-content: center; align-items: flex-end; }
  #scene .chip { align-items: center; text-align: center; border-radius: 8px; }
  #scene .chip b { font-size: 17.5px; } #scene .chip i { font-size: 15.5px; }
  #scene .you { align-self: center; } #scene .tip { text-align: center; }
  #scene .say { width: min(620px, 100%); align-self: center; }
  #scene .say button { width: 46px; height: 46px; }
}
</style>
</head>
<body>
<div id="stage"></div>
<script src="town-game.js"></script>
</body>
</html>
