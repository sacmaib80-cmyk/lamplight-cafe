<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wrenfield — โครงแมพวันแรก</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Nunito:wght@700;800&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #0b1016; overflow: hidden; touch-action: none; }
#stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#townhud { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); width: min(560px, 92vw); padding: 9px 14px; background: #fbf5ea; color: #2b2119; border-radius: 4px; font: 500 15px/1.45 Mali, sans-serif; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
#townhud b { display: block; font-weight: 600; }
#townhud .go { display: inline-block; margin-top: 6px; padding: 6px 16px; background: #2b2119; color: #fbf5ea; border-radius: 4px; text-decoration: none; font-weight: 600; }
#townhud small { display: block; margin-top: 3px; font-size: 12.5px; color: #6b5f55; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="town-game.js"></script>
</body>
</html>
